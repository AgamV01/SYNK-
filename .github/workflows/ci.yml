name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: server
        run: pip install -e ".[dev]"
      - name: Tests + coverage gate
        working-directory: server
        run: pytest --cov=synk --cov-fail-under=80
      - name: Example selftests
        working-directory: server
        run: |
          python examples/tavern.py --selftest
          python examples/headless_demo.py --selftest
          python examples/remembers_you.py --selftest

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: client
        run: npm ci
      - name: Typecheck + build
        working-directory: client
        run: |
          npx tsc --noEmit
          npm run build
      - name: Tests
        working-directory: client
        run: npm test --if-present
