name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: server (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        working-directory: server
        run: pip install -e ".[dev]"
      - name: Tests + coverage gate
        working-directory: server
        run: pytest --cov=synk --cov-fail-under=80
      - name: Example selftests
        working-directory: server
        run: |
          python examples/tavern.py --selftest
          python examples/headless_demo.py --selftest
          python examples/remembers_you.py --selftest

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: client
        run: npm ci
      - name: Typecheck + build
        working-directory: client
        run: |
          npx tsc --noEmit
          npm run build
          npm run build:sdk
      - name: Tests
        working-directory: client
        run: npm test --if-present

  docker:
    name: docker (server image + healthz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t synk-server ./server
      - name: Run and health-check
        run: |
          docker run -d -p 8000:8000 --name synk synk-server
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break || sleep 1
          done
          curl -fsS http://localhost:8000/healthz | grep -q ok
          docker rm -f synk
