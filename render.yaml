# Render Blueprint for the SYNK server (Docker). Deploy: New > Blueprint, point at this repo.
# The client deploys separately to Cloudflare Pages (see DEPLOY.md).
services:
  - type: web
    name: synk-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /healthz
    envVars:
      - key: SYNK_DB_PATH
        value: /data/synk.db
      - key: ALLOWED_ORIGINS
        sync: false # set to your Pages URL, e.g. https://synk.pages.dev
    disk:
      name: synk-data
      mountPath: /data
      sizeGB: 1
